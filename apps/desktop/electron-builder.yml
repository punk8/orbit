appId: dev.orbit.local
productName: Orbit
copyright: Copyright © 2026 Orbit
extraMetadata:
  name: Orbit
  version: 0.0.0
  description: Local-first work context continuity app.
  author: Orbit

directories:
  output: release

files:
  - dist-electron/**/*
  - dist-renderer/**/*
  - package.json
  - "!**/.tmp/**"
  - "!**/fixtures/**"
  - "!**/*.map"

asar: true

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  sign: false
  artifactName: Orbit-Alpha-${version}-${arch}.${ext}

artifactName: Orbit-Alpha-${version}-${arch}.${ext}
